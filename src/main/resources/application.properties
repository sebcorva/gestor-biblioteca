spring.application.name=gestor-biblioteca

# Las credenciales llegan por variables de entorno: no se escriben aqui ni se suben a git.
#   Local:  archivo .env en la raiz del proyecto (copiar .env.example), lo lee la linea de abajo.
#   AWS:    Secrets Manager -> --env-file del contenedor (ver ec2/deploy-api.sh).
spring.config.import=optional:file:.env[.properties]

# Oracle Autonomous Database con wallet.
#   DB_URL: JDBC URL completo (jdbc:oracle:thin:@<alias>?TNS_ADMIN=./wallet) o solo el alias TNS.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT_SECRET: identico al de auth-users (Base64)
jwt.secret=${JWT_SECRET}
